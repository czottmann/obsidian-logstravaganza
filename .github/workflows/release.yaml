name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Package plugin archive
        run: |
          mkdir "${{ github.event.repository.name }}"
          cp main.js manifest.json README.md "${{ github.event.repository.name }}"
          zip -r "${{ github.event.repository.name }}-${{ github.ref_name }}.zip" "${{ github.event.repository.name }}"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            ${{ github.event.repository.name }}-${{ github.ref_name }}.zip
            main.js
            manifest.json
          name: ${{ github.ref_name }}
          prerelease: false
          tag_name: ${{ github.ref_name }}
